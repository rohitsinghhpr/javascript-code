<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debouncing</title>
</head>

<body>

    <div class="container">
        <input type="text" class="input" id="input" />
    </div>

    <script>

        function getInputValue() {
            let id;
            return (event) => {
                clearTimeout(id);
                id = setTimeout(() => {
                    console.log(event.target.value);
                }, 3000);
            }
        }
        const debonceFun = getInputValue();

        // document.getElementById("input").addEventListener("input",()=>{
        //     debonceFun(event);
        // });

        document.getElementById("input").addEventListener("input", debonceFun);

        // Great question! In JavaScript, event handling functions automatically receive an event object as an argument when the event is triggered. This happens implicitly. Let me explain in detail:

    </script>

</body>

</html>
